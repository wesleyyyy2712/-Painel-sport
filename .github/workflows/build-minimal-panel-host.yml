name: Build Minimal Panel Host

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build minimal panel host
        run: |
          set -euo pipefail
          make -f Makefile.panel clean all FINALPACKAGE=1
          DYLIB=$(find .theos/obj -type f -name PanelHost.dylib -print -quit)
          test -s "$DYLIB"
          cp "$DYLIB" "$GITHUB_WORKSPACE/PanelHost.dylib"

      - name: Audit dependencies and launch surface
        run: |
          set -euo pipefail
          DYLIB="$GITHUB_WORKSPACE/PanelHost.dylib"
          otool -L "$DYLIB" | tee "$RUNNER_TEMP/panelhost-dependencies.txt"
          ! grep -Eq 'Orion|CydiaSubstrate|SwiftProtobuf|EeveeSpotify' "$RUNNER_TEMP/panelhost-dependencies.txt"
          grep -aFq 'MPNowPlayingInfoCenter' "$DYLIB"
          grep -aFq '0wwPcA6wtMf6HUMpIRdeP7' "$DYLIB"
          grep -aFq 'PanelHostStart' "$DYLIB"
          ! grep -aFq 'orion_init' "$DYLIB"
          file "$DYLIB" | grep -q 'arm64'

      - uses: actions/upload-artifact@v4
        with:
          name: Minimal-PanelHost
          path: PanelHost.dylib
          if-no-files-found: error
          compression-level: 0
