name: Build Tweak iOS 15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      SWIFTPROTOBUF_VERSION: "1.29.0"

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install SwiftProtobuf framework
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swiftprotobuf"
          cd "$RUNNER_TEMP/swiftprotobuf"
          curl -fL --retry 3 "https://github.com/whoeevee/swift-protobuf/releases/download/${SWIFTPROTOBUF_VERSION}/org.swift.protobuf.swiftprotobuf_${SWIFTPROTOBUF_VERSION}_iphoneos-arm.deb" -o swiftprotobuf.deb
          ar -x swiftprotobuf.deb
          tar -xf data.tar.lzma
          cp -R Library/Frameworks/SwiftProtobuf.framework "$THEOS/lib/"

      - name: Build rootful tweak for iOS 15
        run: |
          set -euo pipefail
          make package FINALPACKAGE=1
          DEB=$(find "$GITHUB_WORKSPACE/packages" -maxdepth 1 -type f -name '*iphoneos-arm.deb' -print -quit)
          test -s "$DEB"
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Validate deployment target
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deb"
          cd "$RUNNER_TEMP/deb"
          ar -x "$DEB"
          tar -xf data.tar.*
          DYLIB=$(find . -type f -name 'EeveeSpotify.dylib' -print -quit)
          test -s "$DYLIB"
          MINOS=$(otool -l "$DYLIB" | awk '/cmd LC_BUILD_VERSION/{found=1} found && /minos/{print $2; exit}')
          test "$MINOS" = '15.0'
          echo "Validated EeveeSpotify deployment target: iOS $MINOS"

      - name: Upload compiled tweak
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-iOS15-DEB
          path: ${{ env.DEB }}
          if-no-files-found: error
