name: Build and Package IPA

on:
  workflow_dispatch:
    inputs:
      spotify_ipa_url:
        description: "MediaFire page or direct URL for the authorized Spotify IPA"
        required: true
        default: "https://www.mediafire.com/file/wfpf5eqrlg0p6et/Spotify_8.9.82_ios_15.0+2.ipa/file"
        type: string

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      SWIFTPROTOBUF_VERSION: "1.29.0"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build standalone trigger package
        run: |
          set -euo pipefail
          make -f Makefile.panel package FINALPACKAGE=1 THEOS_CODESIGN=true
          TRIGGER_DEB=$(find packages -type f -name '*iphoneos-arm.deb' -print -quit)
          test -s "$TRIGGER_DEB"
          cp "$TRIGGER_DEB" "$GITHUB_WORKSPACE/spotify3105trigger.deb"
          echo "TRIGGER_DEB=$GITHUB_WORKSPACE/spotify3105trigger.deb" >> "$GITHUB_ENV"

      - name: Download OpenSpotifySafariExtension
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension
          test -d OpenSpotifySafariExtension/OpenSpotifySafariExtension.appex
          echo "OPENSPOTIFYSAFARIEXTENSION=$GITHUB_WORKSPACE/OpenSpotifySafariExtension/OpenSpotifySafariExtension.appex" >> "$GITHUB_ENV"

      - name: Install IPA injection tools
        run: |
          set -euo pipefail
          git clone --branch v2 --depth 1 https://github.com/whoeevee/ivinject.git ivinject-source
          mkdir -p "$HOME/.ivinject"
          cp -R ivinject-source/KnownFrameworks/. "$HOME/.ivinject/"
          curl -fL --retry 3 https://github.com/whoeevee/ivinject/releases/download/v2/ivinject-arm64 -o ivinject-arm64
          chmod +x ivinject-arm64
          ./ivinject-arm64 --help | grep -q -- '--profile' || true

      - name: Download and validate Spotify IPA
        env:
          SOURCE_URL: ${{ inputs.spotify_ipa_url }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_URL" == https://download*.mediafire.com/* ]]; then
            DOWNLOAD_URL="$SOURCE_URL"
          else
            DOWNLOAD_URL=$(curl -fsSL --retry 3 -A 'Mozilla/5.0' "$SOURCE_URL" \
              | grep -oE 'https://download[0-9]+\.mediafire\.com[^" ]+' \
              | head -1 \
              | sed 's/&amp;/\&/g')
          fi
          test -n "$DOWNLOAD_URL"
          curl -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' "$DOWNLOAD_URL" -o spotify-input.ipa
          unzip -tq spotify-input.ipa
          test "$(stat -f%z spotify-input.ipa)" -gt 1000000

      - name: Inject tweak and create IPA
        run: |
          set -euo pipefail
          ./ivinject-arm64 spotify-input.ipa Painel-Sport-Spotify-8.9.82.ipa \
            -i "$TRIGGER_DEB" \
            -s - -d --level Optimal
          unzip -tq Painel-Sport-Spotify-8.9.82.ipa
          test -s Painel-Sport-Spotify-8.9.82.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Painel-Sport-Spotify-8.9.82-IPA
          path: Painel-Sport-Spotify-8.9.82.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: painel-ipa-${{ github.run_number }}
          name: Painel Sport IPA ${{ github.run_number }}
          body: IPA do Spotify com o Spotify3105Trigger separado; o app 3105 standalone não é incorporado ao Spotify. Commit ${{ github.sha }}.
          draft: true
          files: Painel-Sport-Spotify-8.9.82.ipa
          fail_on_unmatched_files: true
