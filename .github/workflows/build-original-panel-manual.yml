name: Build Painel Original

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: Sources/EeveeSpotify/Panel/extracted/panel/3105-2.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/3105.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/3105.xcarchive/Products/Applications/3105.app" "$RUNNER_TEMP/ipa/Payload/3105.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/3105-original-unsigned.ipa" Payload
          unzip -tq "$GITHUB_WORKSPACE/3105-original-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/3105-original-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-original-unsigned-ipa
          path: 3105-original-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
